<div class="upload-container">
  <!-- Loading Spinner -->
  <ngx-spinner bdColor="rgba(51,51,51,1)" size="medium" color="#fff" type="ball-scale-multiple">
  </ngx-spinner>
  <p-toast />

  <app-header></app-header>

  <div *ngIf="isUploaded; else uploadForm" class="container uploaded-section">
    <div class="row video-section">
      <div class="col-lg-7 video-wrapper">
        <video id="videoDown"  #videoPlayer [src]="video" controlsList="nodownload" controls width="500px" class="vfp"></video>
        <div class="video-overlay" id="videoOverlay" *ngIf="loading">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="col-lg-5 down-section">
        <div *ngIf="isGenerated; else genOptions">
          <button class="btn btn-secondary downVideo" (click)="handleEmbedSubtitleFile()"> <img src="assets/image/srt.png" height="30px" alt=""> Download
            Subtitle</button>
          <button class="btn btn-success downDoc" (click)="embedVideoWithSubtitles()"><img src="assets/image/mp4.png"
              height="30px" alt=""> Download
            Video</button>
        </div>

        <ng-template #genOptions>
          <div class="dropdownBtn">
            <label for="from" class="labelSele"> From :</label>
            <select class="form-select form-select-sm optionFrom" id="from" [value]="fromLang"  (change)="FromSelect($event)">
              <option selected>Select Language</option>
              <option *ngFor="let item of languages" [value]="item.code" class="lang">
                {{ item.name }}
              </option>
            </select>

            <label for="to" class="labelSele">To :</label>
            <select class="form-select form-select-sm optionTo" id="to" [value]="toLang"
              (change)="ToSelect($event)">
              <option selected>Select Language</option>
              <option *ngFor="let item of languages" [value]="item.code" class="lang">
                {{ item.name }}
              </option>
            </select>
          </div>


          <button type="submit" (click)="handleGenerate()" class="genaBtn"> <!-- (click)="handleGenerate()"" -->
            Generate
          </button>
        </ng-template>
      </div>
    </div>
  </div>

  <ng-template #uploadForm>
    <div class="uploading">
      <h1 class="upTitle">
        Upload Video Here, That you can add caption for better understanding
      </h1>
      <button class="btn upBtn" (click)="onButtonClick()">Upload Video</button>
      <input type="file" accept="video/mp4" hidden #inputFileRef />      <!--  (change)="onFileSelected($event)"  -->
      <h2 class="subttlUp">or Drop a file</h2>
      <p class="pasUp">paste url <u>here</u></p>
      <p class="tremsUp">
        By uploading a video or URL you agree to our
        <u>Terms of Service</u>.<br />
        To learn more about how subtai handles your personal data, check our
        <u>Privacy Policy</u>.
      </p>
    </div>
  </ng-template>

</div>
