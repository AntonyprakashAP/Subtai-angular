<app-header></app-header>
<div class="login-container d-flex justify-content-center align-items-center">
    <div class="card login-card p-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">🔐 Login</h4>
            <button class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()">
                Toggle Theme 🌗
            </button>
        </div>

        <form  #registerForm="ngForm" (ngSubmit)="handleLogin(registerForm)">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" ngModel required />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" ngModel required />
            </div>
            <p *ngIf="message"
                [ngClass]="{'bg-danger': message.includes('Invalid'), ' bg-success': !message.includes('failed')}"
                class="mt-3 mb-3 text-white text-center ">
                {{ message }}
            </p>
            <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
        </form>
        <p class="text-center mt-3">
            Don't have an account? <a href="/register">Register here</a>
        </p>

    </div>
</div>
