<app-header></app-header>

<div class="register-container d-flex justify-content-center align-items-center">
    <div class="card register-card p-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">📝 Register</h4>
            <button class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()">
                Toggle Theme 🌗
            </button>
        </div>

        <form #registerForm="ngForm" (ngSubmit)="onRegisterSubmit(registerForm)">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" ngModel required />
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" ngModel required />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" ngModel required />
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" ngModel
                    required />
            </div>
            <p *ngIf="message"
                [ngClass]="{'text-danger bg-danger': message.includes('failed'), 'text-success': !message.includes('failed')}"
                class="mt-3 text-center">
                {{ message }}
            </p>
            <button type="submit" class="btn btn-success w-100 mt-2">Create Account</button>
        </form>
        <p class="text-center mt-3">
            Already have an account? <a href="/login">Login here</a>
        </p>

    </div>
</div>
